---
title: Permission set
---
<p><b>Permission Set</b> is a perk visible on certain <a data-p="Businesses">Businesses</a>. This indicates the Business unlocks a prefix icon.</p>
<p>The chat prefix icons can be accessed and changed via:<br />
<b><code>M → Player Options → Change Chat Appearance → Change Chat Prefix Icon</code></b>.</p>
