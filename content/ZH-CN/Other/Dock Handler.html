<h2 id=".E5.85.A5.E9.97.A8"><span id="入门"></span>入门</h2>
<ul><li>前往 LS 南边的码头的 专业工作中心  。</li>
<li>前往橙色的圈子，然后选择码头装卸员（Dock Handler）。</li>
<li>前往附近的蓝色圆圈并值班.</li>
<li>前往通往车辆仓库 ，并生成车辆.</li>
<li>用吊车在 举起集装箱。</li>
<li>将此集装箱放到在等待的卡车上 </li>
<li>您刚刚装载的卡车将离开，然后您可以移至下一个集装箱。</li></ul>
