<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tycoon Gaming Wiki</title>
    <style>
      :root {
        --bg: #12151a;
        --panel: #1a1e25;
        --panel2: #222731;
        --line: #2d333f;
        --text: #e7eaf0;
        --dim: #97a0b0;
        --acc: #ffb020;
        --acc2: #ffd27a;
        --accfg: #1a1200;
        --link: #6cb6ff;
        --ok: #5ad08a;
        --fs: 15px;
      }
      :root[data-theme="light"] {
        --bg: #f4f1ea;
        --panel: #fffdf8;
        --panel2: #efe9dc;
        --line: #ddd4c2;
        --text: #231f18;
        --dim: #6b6354;
        --acc: #d98a00;
        --acc2: #a86a00;
        --accfg: #fff;
        --link: #0a58b8;
        --ok: #1e8a50;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text);
        font:
          var(--fs)/1.6 "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          Arial,
          sans-serif;
        overflow: hidden;
      }
      body.standalone {
        background: var(--bg);
        pointer-events: auto;
      }
      body.desk {
        background: radial-gradient(120% 90% at 50% 0, #243044, #0d1118);
        pointer-events: auto;
      }
      :root[data-theme="light"] body.desk {
        background: radial-gradient(120% 90% at 50% 0, #cfd8e6, #8d9bb0);
      }
      #win {
        position: absolute;
        display: flex;
        flex-direction: column;
        pointer-events: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        min-width: 0;
      }
      body.standalone #win {
        inset: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      body.standalone #tb {
        display: none;
      }
      #win.max {
        border-radius: 0;
      }
      #win.min {
        height: auto !important;
        min-height: 0;
      }
      #win.min header,
      #win.min .wrap,
      #win.min .rs {
        display: none;
      }
      #tb {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        flex: none;
        padding: 0 6px 0 12px;
        background: linear-gradient(var(--panel2), var(--panel));
        border-bottom: 1px solid var(--line);
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      #tb.drag {
        cursor: grabbing;
      }
      #set {
        position: absolute;
        right: 8px;
        top: 40px;
        width: 272px;
        z-index: 60;
        display: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
        padding: 10px 12px;
      }
      #set.on {
        display: block;
      }
      #set h5 {
        margin: 0 0 6px;
        font-size: 0.78em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      #set label {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 7px 8px;
        border-radius: 8px;
        cursor: pointer;
      }
      #set label:hover {
        background: var(--panel2);
      }
      #set input {
        margin-top: 5px;
        accent-color: var(--acc);
      }
      #set small {
        display: block;
        color: var(--dim);
        line-height: 1.3;
      }
      #set .ib {
        width: 100%;
        margin-top: 8px;
        justify-content: flex-start;
      }
      #tb .ti {
        font-weight: 700;
        font-size: 0.86em;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--dim);
      }
      #tb .ti b {
        color: var(--acc);
      }
      .wb {
        width: 28px;
        height: 24px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--dim);
        font-size: 13px;
        line-height: 1;
        display: grid;
        place-items: center;
      }
      .wb:hover {
        background: var(--panel2);
        color: var(--text);
      }
      .wb.x:hover {
        background: #d9433a;
        color: #fff;
      }
      .wb.on {
        color: var(--acc);
      }
      .rs {
        position: absolute;
        z-index: 50;
        touch-action: none;
      }
      .rs[data-d="r"] {
        right: -3px;
        top: 10px;
        bottom: 10px;
        width: 8px;
        cursor: ew-resize;
      }
      .rs[data-d="l"] {
        left: -3px;
        top: 10px;
        bottom: 10px;
        width: 8px;
        cursor: ew-resize;
      }
      .rs[data-d="b"] {
        bottom: -3px;
        left: 10px;
        right: 10px;
        height: 8px;
        cursor: ns-resize;
      }
      .rs[data-d="t"] {
        top: -3px;
        left: 10px;
        right: 10px;
        height: 8px;
        cursor: ns-resize;
      }
      .rs[data-d="br"] {
        right: -3px;
        bottom: -3px;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
      }
      .rs[data-d="bl"] {
        left: -3px;
        bottom: -3px;
        width: 18px;
        height: 18px;
        cursor: nesw-resize;
      }
      .rs[data-d="tr"] {
        right: -3px;
        top: -3px;
        width: 18px;
        height: 18px;
        cursor: nesw-resize;
      }
      .rs[data-d="tl"] {
        left: -3px;
        top: -3px;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
      }
      body.standalone .rs {
        display: none;
      }
      body.dragging {
        user-select: none;
      }
      body.dragging #win * {
        pointer-events: none;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--link);
      }
      ::selection {
        background: var(--acc);
        color: var(--accfg);
      }
      /* header */
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex: none;
        position: relative;
        z-index: 30;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.95em;
        white-space: nowrap;
        cursor: pointer;
        border: 0;
        background: none;
        padding: 2px 4px;
      }
      .brand i {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--acc);
        color: var(--accfg);
        font-style: normal;
        font-weight: 900;
      }
      .brand span em {
        font-style: normal;
        color: var(--acc);
      }
      .ib {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 8px;
        min-width: 32px;
        height: 32px;
        padding: 0 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        white-space: nowrap;
      }
      .ib:hover:not(:disabled) {
        border-color: var(--acc);
        color: var(--acc2);
      }
      .ib:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #menu {
        display: none;
      }
      .sbox {
        position: relative;
        flex: 1;
        min-width: 120px;
        max-width: 560px;
        margin: 0 auto;
      }
      #q {
        width: 100%;
        height: 34px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--bg);
        padding: 0 38px 0 34px;
        outline: none;
      }
      #q:focus {
        border-color: var(--acc);
        box-shadow: 0 0 0 3px rgba(255, 176, 32, 0.18);
      }
      .sbox svg {
        position: absolute;
        left: 10px;
        top: 9px;
        width: 16px;
        height: 16px;
        color: var(--dim);
        pointer-events: none;
      }
      .sbox kbd {
        position: absolute;
        right: 8px;
        top: 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0 6px;
        font: 12px/20px monospace;
        color: var(--dim);
        pointer-events: none;
      }
      #sx {
        position: absolute;
        right: 6px;
        top: 5px;
        display: none;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 6px;
        background: var(--panel2);
      }
      #res {
        position: absolute;
        left: 0;
        right: 0;
        top: 40px;
        max-height: min(70vh, 520px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        display: none;
        z-index: 40;
      }
      .rr {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        padding: 9px 14px;
      }
      .rr:last-child {
        border-bottom: 0;
      }
      .rr.on,
      .rr:hover {
        background: var(--panel2);
      }
      .rr b {
        display: block;
        font-weight: 600;
      }
      .rr small {
        display: block;
        color: var(--dim);
        line-height: 1.4;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rr mark {
        background: rgba(255, 176, 32, 0.28);
        color: inherit;
        border-radius: 3px;
        padding: 0 1px;
      }
      .rmeta {
        padding: 7px 14px;
        font-size: 0.82em;
        color: var(--dim);
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        background: var(--panel2);
        position: sticky;
        top: 0;
      }
      .rmeta button {
        border: 0;
        background: none;
        color: var(--link);
        padding: 0;
        text-decoration: underline;
      }
      .tag {
        display: inline-block;
        font-size: 0.72em;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 0 6px;
        border-radius: 5px;
        background: var(--panel2);
        border: 1px solid var(--line);
        color: var(--dim);
        margin-left: 6px;
        vertical-align: 1px;
      }
      #lang {
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel2);
        padding: 0 6px;
        max-width: 230px;
        cursor: pointer;
      }
      #lang:focus {
        outline: 2px solid var(--acc);
      }
      /* layout */
      .wrap {
        flex: 1;
        display: flex;
        min-height: 0;
        position: relative;
      }
      nav {
        width: 250px;
        flex: none;
        border-right: 1px solid var(--line);
        background: var(--panel);
        overflow: auto;
        padding: 12px 10px 20px;
      }
      nav h4 {
        margin: 16px 8px 6px;
        font-size: 0.72em;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
      }
      nav h4:first-child {
        margin-top: 2px;
      }
      .ni {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 6px 10px;
        border-radius: 8px;
        color: var(--text);
      }
      .ni:hover {
        background: var(--panel2);
      }
      .ni.on {
        background: var(--acc);
        color: var(--accfg);
        font-weight: 700;
      }
      .ni small {
        color: var(--dim);
      }
      .ni.on small {
        color: inherit;
        opacity: 0.75;
      }
      .ni .t {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      main {
        flex: 1;
        min-width: 0;
        overflow: auto;
        scroll-behavior: smooth;
        position: relative;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 8px 18px;
        background: linear-gradient(var(--bg) 70%, transparent);
      }
      .crumb {
        color: var(--dim);
        font-size: 0.85em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-left: 4px;
      }
      .page {
        max-width: 900px;
        margin: 0 auto;
        padding: 6px 22px 80px;
      }
      h1.pt {
        font-size: 2em;
        line-height: 1.2;
        margin: 0.2em 0 0.3em;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0 14px;
        align-items: center;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 99px;
        padding: 1px 11px;
        font-size: 0.84em;
        color: var(--text);
      }
      .chip:hover {
        border-color: var(--acc);
        color: var(--acc2);
      }
      .chip.l {
        border-style: dashed;
      }
      .lab {
        font-size: 0.78em;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-right: 2px;
      }
      .toc {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 12px;
        padding: 6px 14px;
        margin: 8px 0 20px;
      }
      .toc summary {
        cursor: pointer;
        font-weight: 700;
        padding: 4px 0;
      }
      .toc ol {
        margin: 6px 0 8px;
        padding-left: 20px;
        columns: 2;
        column-gap: 28px;
      }
      .toc li {
        break-inside: avoid;
        padding: 1px 0;
      }
      .toc li.s {
        margin-left: 16px;
        font-size: 0.93em;
      }
      .toc a {
        text-decoration: none;
        cursor: pointer;
      }
      .toc a:hover {
        text-decoration: underline;
      }
      .art {
        overflow-wrap: break-word;
      }
      .art h2,
      .art h3,
      .art h4 {
        line-height: 1.25;
        scroll-margin-top: 56px;
      }
      .art h2 {
        font-size: 1.5em;
        margin: 1.6em 0 0.5em;
        padding-bottom: 0.25em;
        border-bottom: 2px solid var(--line);
      }
      .art h3 {
        font-size: 1.2em;
        margin: 1.3em 0 0.4em;
        color: var(--acc2);
      }
      .art h4 {
        font-size: 1.05em;
        margin: 1.1em 0 0.3em;
      }
      .art a[data-p],
      .art a[data-a] {
        color: var(--link);
        cursor: pointer;
        text-decoration: none;
        border-bottom: 1px dotted currentColor;
      }
      .art a[data-p]:hover,
      .art a[data-a]:hover {
        border-bottom-style: solid;
      }
      .art a[target="_blank"]::after {
        content: " ↗";
        font-size: 0.8em;
      }
      .art ul,
      .art ol {
        padding-left: 1.5em;
      }
      .art li {
        margin: 0.15em 0;
      }
      .art blockquote {
        margin: 1em 0;
        padding: 0.4em 1em;
        border-left: 4px solid var(--acc);
        background: var(--panel);
        border-radius: 0 10px 10px 0;
      }
      .art code,
      .art pre {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 5px;
        font:
          0.9em Consolas,
          monospace;
      }
      .art pre {
        padding: 10px;
        overflow: auto;
      }
      .art p.cap {
        color: var(--dim);
        font-style: italic;
        font-size: 0.9em;
      }
      .tw {
        overflow-x: auto;
        margin: 1em 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }
      .art table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.94em;
      }
      .art th,
      .art td {
        min-width: 3.2em;
        overflow-wrap: break-word;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        border-right: 1px solid var(--line);
        vertical-align: top;
      }
      .art th:last-child,
      .art td:last-child {
        border-right: 0;
      }
      .art tr:last-child td {
        border-bottom: 0;
      }
      .art th {
        background: var(--panel2);
        text-align: left;
      }
      .art tr:nth-child(even) td {
        background: rgba(127, 127, 127, 0.05);
      }
      .art table table {
        font-size: 1em;
      }
      .foot {
        margin-top: 40px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 0.85em;
      }
      .empty {
        padding: 40px 10px;
        text-align: center;
        color: var(--dim);
      }
      /* home */
      .hero {
        margin: 6px 0 22px;
        padding: 26px 26px 22px;
        border-radius: 18px;
        background:
          radial-gradient(120% 140% at 0 0, rgba(255, 176, 32, 0.2), transparent 60%), var(--panel);
        border: 1px solid var(--line);
      }
      .hero h1 {
        margin: 0 0 4px;
        font-size: 2.2em;
        line-height: 1.1;
      }
      .hero h1 em {
        font-style: normal;
        color: var(--acc);
      }
      .hero p {
        margin: 0 0 14px;
        color: var(--dim);
        max-width: 60ch;
      }
      .hero .big {
        position: relative;
        max-width: 520px;
      }
      .hero input {
        width: 100%;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        padding: 0 14px;
        font-size: 1.05em;
        outline: none;
      }
      .hero input:focus {
        border-color: var(--acc);
      }
      .stats {
        margin-top: 12px;
        font-size: 0.84em;
        color: var(--dim);
      }
      .sec {
        margin: 26px 0 10px;
        font-size: 1.05em;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--dim);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .sec button {
        border: 0;
        background: none;
        color: var(--link);
        font-size: 0.8em;
        text-transform: none;
        letter-spacing: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
      }
      .card {
        display: block;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 12px;
        padding: 12px 14px;
        min-height: 64px;
        transition: 0.12s;
      }
      .card:hover {
        border-color: var(--acc);
        transform: translateY(-1px);
      }
      .card b {
        display: block;
        font-size: 1.02em;
      }
      .card small {
        display: block;
        color: var(--dim);
        line-height: 1.35;
        margin-top: 2px;
      }
      .card .ic {
        font-size: 1.4em;
        display: block;
        margin-bottom: 2px;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .pill {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 10px;
        padding: 5px 12px;
      }
      .pill:hover {
        border-color: var(--acc);
        color: var(--acc2);
      }
      .az {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 10px 0 14px;
      }
      .az button {
        min-width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 7px;
        padding: 0 6px;
      }
      .az button.on {
        background: var(--acc);
        color: var(--accfg);
        border-color: var(--acc);
        font-weight: 700;
      }
      .az button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .flt {
        width: 100%;
        max-width: 420px;
        height: 36px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 0 12px;
        outline: none;
      }
      .flt:focus {
        border-color: var(--acc);
      }
      .list {
        list-style: none;
        padding: 0;
        margin: 8px 0;
        columns: 2 280px;
        column-gap: 24px;
      }
      .list li {
        break-inside: avoid;
        margin: 0 0 2px;
      }
      .list button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 6px 10px;
        border-radius: 8px;
      }
      .list button:hover {
        background: var(--panel2);
      }
      .list small {
        display: block;
        color: var(--dim);
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #toast {
        position: absolute;
        left: 50%;

    <script>
      (function () {
        "use strict";

            G.y = y;
            G.w = w;
            G.h = h;

          W.style.top = G.y + "px";

        window.addEventListener("resize", function () {

        applyWin();
        sized();
        if (window.ResizeObserver) new ResizeObserver(sized).observe(W);
        // ---------- data ----------
        function jget(u) {
          return fetch(u).then(function (r) {

        }
        function ensurePack(L) {
          if (PACK[L]) return Promise.resolve(PACK[L]);
          if (LOADING[L]) return LOADING[L];
          return (LOADING[L] = jget(DATA + L + ".json").then(function (d) {
            var by = {},
              low = {};
            d.pages.forEach(function (p) {

            PACK[L] = { pages: d.pages, by: by, low: low, texted: false };

            return PACK[L];
          }));
        }
        function langOf(k) {
          var i = k.indexOf(":");
          if (i > 0) {
            var p = k.slice(0, i).toUpperCase();
            if (
              META.langs.some(function (l) {
                return l.code === p;
              })
            )
              return p;

          return "EN";
        }
        function baseOf(k) {
          var L = langOf(k);

        }
        function mk(L, t) {
          return (L === "EN" ? "" : L + ":") + t;
        }
        function findKey(L, t) {
          var pk = PACK[L];
          if (!pk) return null;
          var k = mk(L, t);
          if (pk.by[k]) return k;
          var lk = pk.low[k.toLowerCase()];
          if (lk) return lk;
          var a = META.aliases[k] || META.aliases[lk || ""];
          if (a && PACK[langOf(a)] && PACK[langOf(a)].by[a]) return a;
          return null;
        }
        function ensureText(L) {
          var pk = PACK[L];
          if (!pk || pk.texted) return;
          pk.pages.forEach(function (p) {
            p.x = (
              p.t +
              " \n" +
              p.h
                .replace(/<[^>]+>/g, " ")
                .replace(/&nbsp;/g, " ")
                .replace(/&amp;/g, "&")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .replace(/\s+/g, " ")

        function resolve(t, L) {
          var m = /^([A-Za-z]{2}(?:-[A-Za-z]{2})?):(.*)$/.exec(t),
            tl = null,
            base = t;
          if (
            m &&
            META.langs.some(function (l) {
              return l.code === m[1].toUpperCase();

          ) {
            tl = m[1].toUpperCase();
            base = m[2].trim();
          }
          var order = tl ? [tl] : L === "EN" ? ["EN"] : [L, "EN"];
          return order.reduce(function (pr, lg) {
            return pr.then(function (f) {
              if (f) return f;
              return ensurePack(lg).then(function () {
                return findKey(lg, base);
              });

        }
        // ---------- routing ----------
        function route(lang, type, arg, frag) {

            "#/" +
            lang +

            type +

        function guessLang() {
          try {
            var n = (navigator.language || "en").toUpperCase();
            if (n === "PT-BR") return "PT-BR";
            if (n === "ZH-CN" || n.indexOf("ZH") === 0) return "ZH-CN";
            var s = n.slice(0, 2);
            if (s === "DA") s = "DK";
            if (s === "KO") s = "KR";
            if (s === "CZ") s = "CS";
            return s;
          } catch (e) {
            return "EN";
          }
        }
        jget(DATA + "meta.json")
          .then(function (m) {
            META = m;
            if (!location.hash) {
              var g = guessLang(),
                has = function (c) {
                  return META.langs.some(function (l) {
                    return l.code === c;
                  });
                };
              if (!localStorage.getItem(KEY) && has(g) && g !== "EN") ST.lang = g;
            }
            if (
              !META.langs.some(function (l) {
                return l.code === ST.lang;
              })
            )
              ST.lang = "EN";
            buildLang();
            if (!location.hash) location.replace(route(ST.lang, "home"));
            else render();
            ensurePack("EN").then(function () {
              ensureText("EN");
            });
          })
          .catch(function () {
            $("main").innerHTML =
              '<div class="empty"><h2>Couldn’t load the wiki data</h2><p>Make sure the <code>data</code> folder is uploaded next to <code>index.html</code>, then reload.</p></div>';
          });
      })();
    </script>
  </body>
</html>
